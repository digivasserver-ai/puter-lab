name: Deploy Site to Puter

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_run:
    workflows: [Deploy Worker to Puter]
    types: [completed]
    branches: [main]

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Sleep for Puter rate limit
        run: sleep 20
      - name: Deploy website
        uses: HeyPuter/puter-subdomain-deploy-action@v1.0.6
        with:
          subdomain: lab-react
          puter_path: ~/Sites/lab-react/
          source_path: site/dist
          puter_token: ${{ secrets.PUTER_AUTH_TOKEN }}